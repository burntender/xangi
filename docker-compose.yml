# 共通設定
x-common: &common
  restart: unless-stopped
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Claude Code CLI 認証情報（コンテナ専用ボリューム）
    - claude-data:/home/node/.claude
    # Codex CLI 認証情報（コンテナ専用ボリューム）
    - codex-data:/home/node/.codex
    # ワークスペース（エージェントの作業ディレクトリ）
    - ${XANGI_WORKSPACE:-./workspace}:/workspace
    # プロンプト（XANGI_COMMANDS.md等）
    - ./prompts:/app/prompts:ro
    # Git設定
    - ~/.gitconfig:/home/node/.gitconfig:ro
    # GitHub App秘密鍵（オプション、設定時のみ有効）
    - ${GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}:/secrets/github-app.pem:ro
  environment: &common-env
    # env_fileから読み込まれない固定値のみここに記述
    - NODE_ENV=production
    - WORKSPACE_PATH=/workspace
    - DATA_DIR=/workspace/.xangi
    # LLMサーバーへの接続（.envで未設定時のデフォルト）
    # llama.cpp: http://llama-cpp:8080
    - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8082}

services:
  # ミニマム版（デフォルト）
  xangi:
    <<: *common
    image: xangi:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: xangi

  # フル版（uv + Python）
  xangi-max:
    <<: *common
    image: xangi:max
    build:
      context: .
      dockerfile: docker/Dockerfile.max
    container_name: xangi-max

  # GPU 版 (CUDA + uv + Python + PyTorch, llama.cpp 依存除去)
  xangi-custom:
    <<: *common
    image: xangi:custom
    build:
      context: .
      dockerfile: docker/Dockerfile.custom
    container_name: xangi-custom
    depends_on:
      - xangi-audio-gateway
    ports:
      - "${AUDIO_CHAT_API_PORT:-18888}:18888"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NODE_ENV=production
      - WORKSPACE_PATH=/workspace
      - DATA_DIR=/workspace/.xangi
      - AUDIO_CHAT_API_ENABLED=${AUDIO_CHAT_API_ENABLED:-false}
      - WEB_CHAT_PORT=18888
      - XANGI_AUDIO_BASE_URL=${XANGI_AUDIO_BASE_URL:-http://xangi-audio-gateway:8000}

  xangi-audio-gateway:
    image: xangi:custom
    build:
      context: .
      dockerfile: docker/Dockerfile.custom
    container_name: xangi-audio-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"  # 統一 STT/TTS API エンドポイント（xangi 専用）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./docker/audio_gateway.py:/app/audio_gateway.py:ro
    environment:
      - STT_BACKEND=${STT_BACKEND:-transformers}
      - STT_BASE_URL=${STT_BASE_URL:-http://host.docker.internal:18081}
      - STT_REQUEST_PATH=${STT_REQUEST_PATH:-/v1/audio/transcriptions}
      - STT_HEALTH_PATH=${STT_HEALTH_PATH:-/health}
      - STT_MODELS_PATH=${STT_MODELS_PATH:-/v1/models}
      - STT_FORCE_LANGUAGE=${STT_FORCE_LANGUAGE:-ja}
      - STT_DEFAULT_TEMPERATURE=${STT_DEFAULT_TEMPERATURE:-0}
      - TRANSFORMERS_STT_BASE_URL=${TRANSFORMERS_STT_BASE_URL:-http://host.docker.internal:18081}
      - VLLM_STT_BASE_URL=${VLLM_STT_BASE_URL:-http://host.docker.internal:8001}
      - TTS_BASE_URL=${TTS_BASE_URL:-http://host.docker.internal:18082}
      - TTS_HEALTH_PATH=${TTS_HEALTH_PATH:-/health}
      - TTS_MODELS_PATH=${TTS_MODELS_PATH:-/v1/models}
      - AUDIO_PROXY_TIMEOUT_SECONDS=${AUDIO_PROXY_TIMEOUT_SECONDS:-300}
      - AUDIO_PROXY_RETRIES=${AUDIO_PROXY_RETRIES:-2}
    command: >
      /opt/gpu-env/.venv/bin/python
      /app/audio_gateway.py

volumes:
  claude-data:
    name: xangi_claude-data
  codex-data:
    name: xangi_codex-data
